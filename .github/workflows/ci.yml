# .github/workflows/ci.yml
#
# Corre en cada push y cada pull request: solo analiza y testea.
# Es intencionalmente rápido, para darte feedback en minutos, no en
# el tiempo que tardan los builds completos del release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Correr tests
        run: flutter test
